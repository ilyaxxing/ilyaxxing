  <circle class="ring" cx="56.0" cy="40" r="5" fill="none" stroke="#8FD694" stroke-width="1.5"/>
  <circle cx="56.0" cy="40" r="5" fill="#8FD694"/>
  <text x="594" y="45" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#8B9098">100</text>
