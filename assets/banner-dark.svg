<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ilyas. Builder working toward 100 real businesses.">
  <style>
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#0B0B0C" stroke="#26262A"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#dots)" mask="url(#m)"/>

  <text x="64" y="68" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#6A6A70">BUILDER  /  EARLY STAGE</text>

  <text x="60" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="116" font-weight="700" letter-spacing="-5" fill="#F3F3F0">Ilyas<tspan fill="#FF5B1F">.</tspan></text>

  <text x="64" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#A0A0A6">I build products and test them on real people.</text>
  <text x="64" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#A0A0A6">The ones that work, I plan to give away.</text>

  <text x="1136" y="68" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#6A6A70">slot 001 / in progress<tspan class="blink" fill="#FF5B1F"> &#9610;</tspan></text>
</svg>
