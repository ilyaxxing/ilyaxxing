<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" width="1200" height="576" role="img" aria-label="Cook it up. Ship it. Share it.">
  <style>
    .blink { animation: blink 1.8s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="574" rx="32" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <text x="72" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" letter-spacing="1" fill="#59636E">@ilyaxxing</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2.5">
    <text x="68" y="196" fill="#1F2328">Cook it up.</text>
    <text x="68" y="290" fill="#1F2328">Ship it.</text>
    <text x="68" y="384" fill="#1A7F37">Share it.</text>
  </g>
  <text x="72" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#59636E">Real stuff, tested on real people.</text>
  <text x="72" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#59636E">If it slaps, it goes open source.</text>

  <g opacity="0.9">
    <rect x="716" y="124" width="440" height="236" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
    <text x="748" y="182" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#59636E">Next up</text>
    <rect x="1011" y="160" width="113" height="30" rx="15" fill="none" stroke="#BC4C00" stroke-dasharray="4 4"/>
    <circle class="" cx="1029" cy="175" r="5" fill="#BC4C00"/>
    <text x="1042" y="181" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#BC4C00">cookin'</text>
    
  </g><g opacity="1.0">
    <rect x="690" y="190" width="440" height="236" rx="22" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
    <text x="722" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#59636E">Fresh drop</text>
    <rect x="1014" y="226" width="84" height="30" rx="15" fill="#1A7F3720" stroke="none" stroke-dasharray="4 4"/>
    <circle class="blink" cx="1032" cy="241" r="5" fill="#1A7F37"/>
    <text x="1045" y="247" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#1A7F37">live</text>
    <text x="722" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F2328">Cash for Cars</text><text x="722" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#59636E">QR codes, anywhere you want.</text><text x="722" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#59636E">Buyer gets pinged instantly.</text>
