<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="ilyas. I build things on the internet, mostly to see what happens.">
  <style>
    .sway { animation: sway 7s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) } }
    @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
  </style>
  <defs>
    <radialGradient id="lamp" gradientUnits="userSpaceOnUse" cx="260" cy="215" r="200">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="400" fill="url(#lamp)"/>

  <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-8" fill="#1F2328">ilyas</text>
  <g class="sway" style="transform-origin:402px 135px"><circle cx="402.0" cy="92.6" r="12.0" fill="#3F9A4A"/><circle cx="391.8" cy="108.2" r="12.0" fill="#3F9A4A"/><circle cx="412.2" cy="108.2" r="12.0" fill="#3F9A4A"/><path d="M402.0,108.8 q3.6,19.2 15.6,28.8" stroke="#3F9A4A" stroke-width="4.6" stroke-linecap="round" fill="none"/></g>

  <text x="8" y="300" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="38" fill="#656D76">I build things on the internet,</text>
  <text x="8" y="350" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="38" fill="#656D76">mostly to see what happens.</text>
</svg>
